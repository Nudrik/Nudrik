<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="100%" height="100%" style="background-color: transparent;">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="15%" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#3fb950" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d2a8ff" stop-opacity="1"/>
      <stop offset="65%" stop-color="#3fb950" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <filter id="dividerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dividerDots" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.5" fill="#58a6ff" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background dots -->
  <rect x="0" y="0" width="800" height="40" fill="url(#dividerDots)" opacity="0.3"/>

  <!-- Main gradient line -->
  <line x1="0" y1="20" x2="800" y2="20" stroke="url(#dividerGrad)" stroke-width="1.5" filter="url(#dividerGlow)"/>

  <!-- Top glow line -->
  <line x1="200" y1="18" x2="600" y2="18" stroke="#58a6ff" stroke-width="0.3" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Bottom glow line -->
  <line x1="200" y1="22" x2="600" y2="22" stroke="#d2a8ff" stroke-width="0.3" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/>
  </line>

  <!-- Center diamond -->
  <polygon points="400,15 405,20 400,25 395,20" fill="#58a6ff" opacity="0.6" filter="url(#dividerGlow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </polygon>

  <!-- Left small diamonds -->
  <polygon points="200,17 203,20 200,23 197,20" fill="#3fb950" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="600,17 603,20 600,23 597,20" fill="#d2a8ff" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </polygon>

  <!-- Scanning particle -->
  <circle r="2" fill="#7ee787" filter="url(#dividerGlow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M50,20 C200,15 400,25 600,20 S750,15 750,20"/>
  </circle>

  <!-- Dot decorations -->
  <circle cx="100" cy="20" r="1.5" fill="#58a6ff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="20" r="1.5" fill="#3fb950" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="20" r="1.5" fill="#d2a8ff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="20" r="1.5" fill="#f0883e" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
